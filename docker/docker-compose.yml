# =============================================================
# CDC 同步栈 · 单节点一键版（部署在 ClickHouse 所在服务器 B 服）
# MySQL(A 服) / ClickHouse(B 服宿主机原生) 为外部服务，由 .env 配置
# 一键启动：cp .env.example .env && 改好 .env && docker compose up -d --build
#
# 单节点 Kafka(KRaft)，含堆内存限制，约 3~4G 内存即可跑。
# 需要高可用(RF=3, 容忍单节点故障)时改用：docker compose -f docker-compose.ha.yml up -d --build
#
# 【安全默认】
#   - Kafka 全链路 SASL_PLAINTEXT + PLAIN（broker 间、Schema Registry、Connect、
#     Debezium、CK Kafka 引擎、监控面板 全部带凭据）。
#   - 除 nginx 反代(443) 外，所有端口只绑定 127.0.0.1，公网仅暴露一个 HTTPS 页面。
# =============================================================
services:

  # ---------------- Kafka (KRaft 单节点) ----------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: cdc-kafka
    ports:
      # 仅回环：宿主机原生 ClickHouse 用 127.0.0.1:9094 消费，公网不可达
      - "127.0.0.1:9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL = 容器间（Connect/SR/监控）；EXTERNAL = 宿主机 CK
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9094
      # controller(内部仲裁) 保持 PLAINTEXT，broker 对客户端两个监听器都走 SASL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # ---- SASL ----
      # 注意：broker 是服务端，必须给每个监听器单独配 JAAS（listener.name.<名>.plain.sasl.jaas.config）。
      # 只有 KAFKA_SASL_JAAS_CONFIG 是不够的 —— 那会映射成客户端的 sasl.jaas.config，
      # 启动时会报: Could not find a 'KafkaServer' or 'internal.KafkaServer' entry in the JAAS configuration
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA_SASL_ADMIN_USER:-admin}"
        password="${KAFKA_SASL_ADMIN_PASSWORD}"
        user_${KAFKA_SASL_ADMIN_USER:-admin}="${KAFKA_SASL_ADMIN_PASSWORD}"
        user_${KAFKA_SASL_USER:-cdc}="${KAFKA_SASL_PASSWORD}";
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA_SASL_ADMIN_USER:-admin}"
        password="${KAFKA_SASL_ADMIN_PASSWORD}"
        user_${KAFKA_SASL_ADMIN_USER:-admin}="${KAFKA_SASL_ADMIN_PASSWORD}"
        user_${KAFKA_SASL_USER:-cdc}="${KAFKA_SASL_PASSWORD}";
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx1024M -Xms512M"
      # 允许大消息（logs/base64图片等大字段，单条 CDC 事件可能远超默认 1MB）
      KAFKA_MESSAGE_MAX_BYTES: "${KAFKA_MAX_MESSAGE_BYTES:-67108864}"
      KAFKA_REPLICA_FETCH_MAX_BYTES: "${KAFKA_MAX_MESSAGE_BYTES:-67108864}"
      KAFKA_SOCKET_REQUEST_MAX_BYTES: "209715200"
      CLUSTER_ID: cdc-kraft-cluster-0001
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # 开 SASL 后 kafka-broker-api-versions 需凭据文件，这里只做端口连通性探测
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9092'"]
      interval: 15s
      timeout: 10s
      retries: 12

  # ---------------- Schema Registry ----------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: cdc-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      # 仅回环：CK(宿主机原生) 读 schema 用 127.0.0.1:8081
      - "127.0.0.1:8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      # 连 SASL 化的 broker（Kafka Store 侧凭据）
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: SASL_PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: SASL_PLAINTEXT
      SCHEMA_REGISTRY_KAFKASTORE_SASL_MECHANISM: PLAIN
      SCHEMA_REGISTRY_KAFKASTORE_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA_SASL_USER:-cdc}" password="${KAFKA_SASL_PASSWORD}";
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xmx384M"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ---------------- Kafka Connect (Debezium) ----------------
  connect:
    build:
      context: ..
      dockerfile: docker/connect.Dockerfile
    image: cdc-connect:latest
    container_name: cdc-connect
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    ports:
      # 仅回环：Connect REST 无鉴权，绝不能暴露公网
      - "127.0.0.1:8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      # ---- worker 连 broker 的 SASL 凭据（内部存储 topic / 偏移 / 状态）----
      CONNECT_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_SASL_MECHANISM: PLAIN
      CONNECT_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA_SASL_USER:-cdc}" password="${KAFKA_SASL_PASSWORD}";
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: cdc-connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: _cdc_connect_configs
      CONNECT_OFFSET_STORAGE_TOPIC: _cdc_connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: _cdc_connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      KAFKA_HEAP_OPTS: "-Xmx1536M -Xms768M"
      # Connect worker 生产者默认允许大消息（连接器级也已 override）
      CONNECT_PRODUCER_MAX_REQUEST_SIZE: "${KAFKA_MAX_MESSAGE_BYTES:-67108864}"
      CONNECT_PRODUCER_COMPRESSION_TYPE: lz4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 20s
      timeout: 10s
      retries: 12

  # ---------------- 监控 Web 应用（就是你现在这个页面）----------------
  cdc-monitor:
    build:
      context: ..
      dockerfile: docker/monitor.Dockerfile
    image: cdc-monitor:latest
    container_name: cdc-monitor
    depends_on:
      connect:
        condition: service_started
    env_file:
      - .env
    environment:
      # 面板经反代对外，Cookie 只在 HTTPS 上发送；反代与面板同机，故信任其 X-Forwarded-For
      CDC_PANEL_COOKIE_SECURE: "1"
      CDC_TRUST_FORWARDED_FOR: "1"
    ports:
      # 只绑回环：公网流量一律经 nginx(443) 进来
      - "127.0.0.1:${MONITOR_PORT:-8080}:8000"
    extra_hosts:
      # 让容器用 host.docker.internal 访问宿主机上的原生 ClickHouse
      - "host.docker.internal:host-gateway"
    volumes:
      - ../config:/app/config      # settings.yaml / tables.yaml 持久化，可网页编辑
      - ../cdc_sync:/app/cdc_sync  # 应用代码（改了 exec 重跑即生效，不用重建镜像）
      - ../templates:/app/templates # CK 建表模板
      - ../main.py:/app/main.py
      - ../out:/app/out            # 生成产物持久化

volumes:
  kafka-data:
