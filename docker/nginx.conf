# =============================================================
# CDC 监控面板反代 —— 宿主机 Nginx 独立安装版
#
# 放置位置（Ubuntu，apt 安装的 nginx）：
#   /etc/nginx/conf.d/cdc-panel.conf
#
# 依赖关系：
#   - docker compose 里的 cdc-monitor 只发布到 127.0.0.1:8080（不对外）
#   - 本 nginx 监听公网 80/443，转发到 127.0.0.1:8080
#
# 证书默认路径：
#   /etc/nginx/certs/fullchain.pem
#   /etc/nginx/certs/privkey.pem
# 自签方法见部署文档「五、Nginx 反代与 TLS」。
# =============================================================

# 登录接口限速：防暴力破解（面板自身也有告警，这里直接限流）
limit_req_zone $binary_remote_addr zone=cdc_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=cdc_api:10m rate=120r/m;

upstream cdc_panel {
    # compose 把面板发布在宿主机回环上
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # 用 listen 里带 http2 的写法：兼容 Ubuntu 22.04(nginx 1.18) / 24.04(nginx 1.24)
    # 以及 1.25+（新版只会给个 deprecation 警告，功能正常）。
    # 不要用 `http2 on;`——它需要 nginx >= 1.25.1，apt 安装的版本会直接启动失败。
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 只保留现代 TLS
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:CDC_SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 64m;   # 导入 .sql 文件 / 大结果集导出

    # ---- 统一代理头 ----
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # 覆盖写 X-Forwarded-For：绝不透传客户端自带值，防止伪造 IP 绕过限流
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 登录接口单独限速
    location = /api/login {
        limit_req zone=cdc_login burst=5 nodelay;
        proxy_pass http://cdc_panel;
    }

    location /api/ {
        limit_req zone=cdc_api burst=40 nodelay;
        proxy_pass http://cdc_panel;
        # 查询导出可能较慢
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://cdc_panel;
    }
}
