# =============================================================
# CDC 同步栈 —— 部署在 ClickHouse 所在服务器(B 服)  ·  Kafka 3 节点高可用版
# MySQL(A 服) / ClickHouse(B 服宿主机原生) 均为外部服务，通过 .env 配置
# 启动：cp .env.example .env && 改好 .env && docker compose up -d --build
#
# Kafka：3 节点 KRaft（broker+controller 合并角色），RF=3 / min ISR=2
# 宿主机原生 ClickHouse 通过 localhost:9094,9095,9096 消费三个 broker
# =============================================================

# 三个 broker 复用的公共环境（YAML 锚点）
x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.6.1
  environment: &kafka-common-env
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    # INTERNAL = 容器间；EXTERNAL = 宿主机 CK；CONTROLLER 内部仲裁保持 PLAINTEXT
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
    # ---- SASL ----
    # broker 是服务端，必须给每个监听器单独配 JAAS（listener.name.<名>.plain.sasl.jaas.config）。
    # 只配 KAFKA_SASL_JAAS_CONFIG 会映射成客户端 sasl.jaas.config，启动即失败：
    #   Could not find a 'KafkaServer' or 'internal.KafkaServer' entry in the JAAS configuration
    KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
    KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
    KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: >-
      org.apache.kafka.common.security.plain.PlainLoginModule required
      username="${KAFKA_SASL_ADMIN_USER:-admin}"
      password="${KAFKA_SASL_ADMIN_PASSWORD}"
      user_${KAFKA_SASL_ADMIN_USER:-admin}="${KAFKA_SASL_ADMIN_PASSWORD}"
      user_${KAFKA_SASL_USER:-cdc}="${KAFKA_SASL_PASSWORD}";
    KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: >-
      org.apache.kafka.common.security.plain.PlainLoginModule required
      username="${KAFKA_SASL_ADMIN_USER:-admin}"
      password="${KAFKA_SASL_ADMIN_PASSWORD}"
      user_${KAFKA_SASL_ADMIN_USER:-admin}="${KAFKA_SASL_ADMIN_PASSWORD}"
      user_${KAFKA_SASL_USER:-cdc}="${KAFKA_SASL_PASSWORD}";
    # 高可用副本参数
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    # 允许大消息（logs/base64图片等大字段，单条 CDC 事件可能远超默认 1MB）
    KAFKA_MESSAGE_MAX_BYTES: "${KAFKA_MAX_MESSAGE_BYTES:-67108864}"
    KAFKA_REPLICA_FETCH_MAX_BYTES: "${KAFKA_MAX_MESSAGE_BYTES:-67108864}"
    KAFKA_SOCKET_REQUEST_MAX_BYTES: "209715200"
    CLUSTER_ID: cdc-kraft-cluster-0001
  healthcheck:
    # 开 SASL 后 api-versions 需凭据文件，只做端口连通性探测
    test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9092'"]
    interval: 15s
    timeout: 10s
    retries: 12

services:

  # ---------------- Kafka broker 1 ----------------
  kafka1:
    <<: *kafka-common
    container_name: cdc-kafka1
    ports:
      - "127.0.0.1:9094:9094"          # 仅回环：原生 ClickHouse 用 127.0.0.1:9094
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9094
    volumes:
      - kafka1-data:/var/lib/kafka/data

  # ---------------- Kafka broker 2 ----------------
  kafka2:
    <<: *kafka-common
    container_name: cdc-kafka2
    ports:
      - "127.0.0.1:9095:9095"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9095
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9095
    volumes:
      - kafka2-data:/var/lib/kafka/data

  # ---------------- Kafka broker 3 ----------------
  kafka3:
    <<: *kafka-common
    container_name: cdc-kafka3
    ports:
      - "127.0.0.1:9096:9096"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9096
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9096
    volumes:
      - kafka3-data:/var/lib/kafka/data

  # ---------------- Schema Registry ----------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: cdc-schema-registry
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: SASL_PLAINTEXT://kafka1:9092,SASL_PLAINTEXT://kafka2:9092,SASL_PLAINTEXT://kafka3:9092
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: SASL_PLAINTEXT
      SCHEMA_REGISTRY_KAFKASTORE_SASL_MECHANISM: PLAIN
      SCHEMA_REGISTRY_KAFKASTORE_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA_SASL_USER:-cdc}" password="${KAFKA_SASL_PASSWORD}";
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ---------------- Kafka Connect (Debezium) ----------------
  connect:
    build:
      context: ..
      dockerfile: docker/connect.Dockerfile
    image: cdc-connect:latest
    container_name: cdc-connect
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }
      schema-registry: { condition: service_started }
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      # ---- worker 连 broker 的 SASL 凭据 ----
      CONNECT_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_SASL_MECHANISM: PLAIN
      CONNECT_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA_SASL_USER:-cdc}" password="${KAFKA_SASL_PASSWORD}";
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: cdc-connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: _cdc_connect_configs
      CONNECT_OFFSET_STORAGE_TOPIC: _cdc_connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: _cdc_connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      CONNECT_PRODUCER_MAX_REQUEST_SIZE: "${KAFKA_MAX_MESSAGE_BYTES:-67108864}"
      CONNECT_PRODUCER_COMPRESSION_TYPE: lz4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 20s
      timeout: 10s
      retries: 10

  # ---------------- 监控 Web 应用 ----------------
  cdc-monitor:
    build:
      context: ..
      dockerfile: docker/monitor.Dockerfile
    image: cdc-monitor:latest
    container_name: cdc-monitor
    depends_on:
      connect: { condition: service_started }
    env_file:
      - .env
    environment:
      CDC_PANEL_COOKIE_SECURE: "1"
      CDC_TRUST_FORWARDED_FOR: "1"
    ports:
      # 只绑回环：公网流量一律经 nginx(443) 进来
      - "127.0.0.1:${MONITOR_PORT:-8080}:8000"
    extra_hosts:
      # 让容器用 host.docker.internal 访问宿主机上的原生 ClickHouse（Linux 需要）
      - "host.docker.internal:host-gateway"
    volumes:
      - ../config:/app/config      # tables.yaml / settings.docker.yaml / 可放 .sql 导出
      - ../cdc_sync:/app/cdc_sync  # 应用代码（改了 exec 重跑即生效，不用重建镜像）
      - ../templates:/app/templates # CK 建表模板
      - ../main.py:/app/main.py
      - ../out:/app/out            # 生成产物持久化

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
